- name: Copy the mongodb module 
  ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name:  Install mongodb 
  ansible.builtin.package:
    name: mongodb-org
    state: present

- name: Enable and start the mongodb service 
  ansible.builtin.service:
    name: mongod
    state: started
    enabled: yes

- name: Allow remote connection
  ansible.builtin.replace:
    path: /etc/mongod.conf
    regexp: '127.0.0.1'
    replace: '0.0.0.0'

- name: Restart the mongodb service 
  ansible.builtin.service:
    name: mongod
    state: restarted