- name:  Enable mysql 8.4 service 
  command: dnf module enable mysql:8.4 -y

- name:  Install mysql 
  ansible.builtin.package:
    name: mysql-server
    state: present

- name: Enable and start the Mysql service 
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: yes

- name: create Mysql root password
  command:  "mysql_secure_installation --set-root-pass {{ mysql_root_password }}"
  