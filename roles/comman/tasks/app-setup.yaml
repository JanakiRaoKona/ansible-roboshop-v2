- name: Create a user 'roboshop' with a /app directory
  ansible.builtin.user:
    name: roboshop
    create_home: false 
    home: /app
    system: true 
    shell: /sbin/nologin
    comment: "roboshop system user"

- name: remove existing app directory
  ansible.builtin.file:
    path: /app
    state: absent

- name: remove existing {{ component }} zip
  ansible.builtin.file:
    path: /tmp/{{ component }}.zip
    state: absent

- name: Create app directory
  ansible.builtin.file:
    path: /app
    state: directory

- name: Download {{ component }} application 
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/{{ component }}-v4.zip
    dest: /tmp/{{ component }}.zip

- name:  unzip the file 
  ansible.builtin.unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes