- name: Create Ec2 instances and Route53 records 
  hosts: local 
  connection: local
  vars:
    instances: ["mongodb", "redis" , "mysql", "rabbitmq", "catalogue", "user", "cart", "shipping", "payment", "frontend"]
    action_create_or_terminate: create 
    domain_name: janakiraodevops.online 
    ami_id: ami-0055977a6e828a4f4
    instance_type: t3.micro
  tasks:
    - name: Create Ec2 instance 
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        region: us-east-1
        security_groups:
          - roboshop-comman
          - "roboshop-{{ item }}" 
      loop: "{{ instances }}"
      when: action_create_or_terminate == "create"
      register: ec2_output

    # - name:  print the creation ec2_output
    #   debug:
    #     msg: "{{ item.instances[0].private_ip_address }}"
    #   loop: "{{ ec2_output.results }}"
    - name:  Create r53 records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{domain_name}}" #mongodb.janakiraodevops.online 
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        overwrite:  true 
      loop: "{{ ec2_output.results }}"
      when: action_create_or_terminate == "create" 

    - name:  Create r53 frontend records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}" #janakiraodevops.online 
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        overwrite:  true 
      loop: "{{ ec2_output.results }}"
      when: action_create_or_terminate == "create"  and item.item == "frontend"

    - name: Delete r53 records 
      amazon.aws.route53:
        state: absent 
        zone: "{{ domain_name }}"
        record: "{{ item }}.{{domain_name}}" #mongodb.janakiraodevops.online 
        type: A
        ttl: 1
      loop: "{{ instances }}"
      when: action_create_or_terminate == "delete"
    
    - name: Delete r53 frontend records 
      amazon.aws.route53:
        state: absent 
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}" #janakiraodevops.online 
        type: A
        ttl: 1
        # loop: "{{ instances }}"
      when: action_create_or_terminate == "delete" and instances.item == "frontend"
     
    - name: Delete Ec2 instances 
      amazon.aws.ec2_instance:
        state: absent 
        name: "roboshop-{{ item }}"
        region: us-east-1
        wait: false
      loop: "{{ instances }}"
      when: action_create_or_terminate == "delete"
 



    

  
  
